name: custom_windows_build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/recursive-random-directory

env:
  BUILD_PYTHON_VERSION: "3.10"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run focused directory-navigation tests
        run: uv run pytest -q tests/test_utils_next_file.py

      - name: Run full test suite
        run: uv run pytest -q

      - name: Lint modified Python modules
        run: uv run ruff check gridplayer/utils/next_file.py gridplayer/player/player.py

  build_windows_x64:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - name: Set up Python x64
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}
          architecture: x64

      - name: Install build tools
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install wget zip

      - name: Build GridPlayer Windows x64 packages
        env:
          BUILD_ARCH: win64
        run: |
          just build-win-package
          just clean-pyinstaller-dist

      - name: Upload Windows x64 packages
        uses: actions/upload-artifact@v7
        with:
          name: GridPlayer-custom-windows-x64
          path: dist
          if-no-files-found: error
