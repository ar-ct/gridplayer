name: custom_windows_build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/recursive-random-directory

env:
  BUILD_PYTHON_VERSION: "3.10"

concurrency:
  group: custom-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run focused custom-feature tests
        run: >-
          uv run pytest -q
          tests/test_utils_next_file.py
          tests/test_video_block_shuffle_root.py
          tests/test_local_file_path_forwarding.py
          tests/test_sharpen_filter.py
          tests/test_color_adjust.py
          tests/test_global_playback_rate.py
          tests/test_cell_random.py
          tests/test_english_only.py

      - name: Run remaining test suite
        run: >-
          uv run pytest -q
          --ignore=tests/test_compositor.py
          --ignore=tests/test_utils_next_file.py
          --ignore=tests/test_video_block_shuffle_root.py
          --ignore=tests/test_local_file_path_forwarding.py
          --ignore=tests/test_sharpen_filter.py
          --ignore=tests/test_color_adjust.py
          --ignore=tests/test_global_playback_rate.py
          --ignore=tests/test_cell_random.py
          --ignore=tests/test_english_only.py

      - name: Lint modified Python modules
        run: >-
          uv run ruff check
          gridplayer/settings.py
          gridplayer/dialogs/settings_sharpen.py
          gridplayer/dialogs/settings_color_adjust.py
          gridplayer/utils/cell_random.py
          gridplayer/utils/english_only.py
          gridplayer/utils/libvlc_options_parser.py
          gridplayer/utils/next_file.py
          gridplayer/utils/playback_rate.py
          gridplayer/utils/video_adjust.py
          gridplayer/widgets/video_block.py
          gridplayer/player/player.py
          gridplayer/player/managers/settings.py
          gridplayer/player/managers/video_blocks.py
          tests/test_sharpen_filter.py
          tests/test_color_adjust.py
          tests/test_video_block_shuffle_root.py
          tests/test_global_playback_rate.py
          tests/test_cell_random.py
          tests/test_english_only.py
          tests/windows_english_only_smoke.py

  build_windows_x64:
    needs: test
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - name: Set up Python x64
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install project and test dependencies
        run: uv sync --group dev

      - name: Validate custom controls and directory navigation on Windows x64
        run: >-
          uv run pytest -q
          tests/test_utils_next_file.py
          tests/test_video_block_shuffle_root.py
          tests/test_color_adjust.py
          tests/test_global_playback_rate.py
          tests/test_cell_random.py
          tests/test_english_only.py

      - name: Install build tools
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install wget zip

      - name: Build GridPlayer Windows x64 packages
        env:
          BUILD_ARCH: win64
        run: just build-win-package

      - name: Smoke-test bundled VLC with Unicode long path and video filters
        run: python tests/windows_vlc_unicode_smoke.py dist/GridPlayer/libVLC

      - name: Verify English-only portable tree
        run: python tests/windows_english_only_smoke.py dist/GridPlayer

      - name: Upload Windows x64 packages
        uses: actions/upload-artifact@v7
        with:
          name: GridPlayer-custom-windows-x64
          path: dist
          if-no-files-found: error

  report_status:
    if: always()
    needs: [test, build_windows_x64]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report custom CI result
        uses: actions/github-script@v8
        with:
          script: |
            const passed =
              '${{ needs.test.result }}' === 'success' &&
              '${{ needs.build_windows_x64.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'custom_windows_build',
              description: passed
                ? 'Tests and Windows x64 build passed'
                : 'Custom tests or Windows x64 build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
