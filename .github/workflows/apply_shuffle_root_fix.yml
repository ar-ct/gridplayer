name: apply_shuffle_root_fix

on:
  push:
    branches:
      - agent/recursive-random-directory
    paths:
      - .github/workflows/apply_shuffle_root_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply minimal shuffle-root lifecycle fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("gridplayer/widgets/video_block.py")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """    def set_video(self, video_params: Video):
                  if self.video_params is None or video_params is not self.video_params:
                      self._shuffle_directory_root = None

          """.replace("          ", ""),
                  """    def set_video(self, video_params: Video):
                  if self._shuffle_directory_root is not None and (
                      not video_params.is_local_file
                      or not video_params.uri.is_relative_to(self._shuffle_directory_root)
                  ):
                      self._shuffle_directory_root = None

          """.replace("          ", ""),
              ),
              (
                  """    @only_initialized
                  @only_local_file
                  def previous_video(self):
                      self._shuffle_directory_root = None
                      self.switch_video(previous_video_file(self.video_params.uri))

                  @only_initialized
                  @only_local_file
                  def next_video(self):
                      self._shuffle_directory_root = None
                      self.switch_video(next_video_file(self.video_params.uri))
          """.replace("          ", ""),
                  """    @only_initialized
                  @only_local_file
                  def previous_video(self):
                      self.switch_video(previous_video_file(self.video_params.uri))

                  @only_initialized
                  @only_local_file
                  def next_video(self):
                      self.switch_video(next_video_file(self.video_params.uri))
          """.replace("          ", ""),
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match, found {count}")
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridplayer/widgets/video_block.py
          git diff --cached --check
          git commit -m "Preserve recursive shuffle collection root"
          git push
